<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ESG Transition Challenge · Strategy Simulation</title>
  <meta name="description" content="EMBA strategy implementation simulation (English) — lead a group-wide ESG transition, convert 12 key stakeholders within 60 resource units, and compare your strategy with peers." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050d0f;
      color: #d8eef4;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #050d0f;
      color: #0d8b96;
      font-size: 1rem;
      letter-spacing: 0.05em;
      z-index: 10;
      transition: opacity 0.45s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spin {
      width: 34px; height: 34px;
      border: 3px solid rgba(13, 139, 150, .25);
      border-top-color: #0d8b96;
      border-radius: 50%;
      animation: sp 0.9s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    #slow { display: none; margin-top: 4px; font-size: .85rem; color: #6f8b94; text-align: center; max-width: 30rem; line-height: 1.6; }
    #slow a { color: #0d8b96; }
    /* 直接打开：加载慢时给一条不用等 iframe 的路 */
    #direct {
      display: none; margin-top: 6px;
      padding: 10px 20px; border-radius: 999px;
      border: 1px solid rgba(13,139,150,.55);
      color: #6fd8dd; text-decoration: none;
      font-size: .9rem; letter-spacing: .02em;
    }
    #direct.on { display: inline-block; }
    #elapsed { font-size: .78rem; color: #4d6b77; letter-spacing: .06em; }
    noscript { display: block; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spin"></div>
    <div id="msg">Loading ESG simulation…</div>
    <div id="slow">Waking the game server — this can take a few seconds the first time.
      <a href="./">Reload</a></div>
    <a id="direct" href="https://b0cb96bd02d0466eaefd081fc1872ff1.sg2.agentos-app.run/esg/en" target="_top" rel="noopener">Open it directly →</a>
    <div id="elapsed"></div>
  </div>
  <iframe
    id="app"
    src="https://b0cb96bd02d0466eaefd081fc1872ff1.sg2.agentos-app.run/esg/en"
    title="ESG Transition Challenge"
    allow="fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
    onload="window.__appLoaded = true; document.getElementById('loading').classList.add('hidden')"
  ></iframe>
  <noscript>This simulation requires JavaScript. Please enable it and reload.</noscript>
  <script>
    /* 当前游戏地址从这里读，不再写死在页面里。
       每次重新发布游戏，只需要改 current.json 一行，这个入口页就跟着走。 */
    (function () {
      var FALLBACK = 'https://b0cb96bd02d0466eaefd081fc1872ff1.sg2.agentos-app.run/esg/en';
      var frame = document.getElementById('app');
      var direct = document.getElementById('direct');

      function apply(url) {
        if (!url || typeof url !== 'string' || url.indexOf('http') !== 0) return;
        if (frame.getAttribute('src') !== url) frame.src = url;
        direct.href = url;
      }

      apply(FALLBACK);
      fetch('current.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { if (j && j.url) apply(j.url); })
        .catch(function () { /* 拿不到就用内置的兜底地址 */ });
    })();
  </script>
  <script>
    /* 加载态分三段：先等，再解释，最后给一条直连。
       之前只有一句 "Loading…"，慢的时候看起来就是卡死了。 */
    (function () {
      var t0 = Date.now();
      var msg = document.getElementById('msg');
      var slow = document.getElementById('slow');
      var direct = document.getElementById('direct');
      var elapsed = document.getElementById('elapsed');
      var l = document.getElementById('loading');

      var tick = setInterval(function () {
        if (window.__appLoaded) { clearInterval(tick); return; }
        var s = Math.round((Date.now() - t0) / 1000);
        elapsed.textContent = s + 's';
        if (s >= 4) { msg.textContent = 'Still loading…'; slow.style.display = 'block'; }
        if (s >= 12) {
          msg.textContent = 'Taking longer than usual';
          direct.classList.add('on');
        }
        /* 服务是冷启动的，第一次打开常常要十几秒。别自动刷新——
           刷新会把等待重新计时，反而更像卡死。给个直连就够了。 */
        if (s >= 25) {
          msg.textContent = 'The server is still waking up';
          direct.classList.add('on');
        }
      }, 1000);
    })();
  </script>
</body>
</html>
